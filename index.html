<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compagnon - Instabilité</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      background-image: radial-gradient(#1e1e1e 1px, transparent 0);
      background-size: 24px 24px;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Porte d'accès (Gate) */
    .gate {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .gate-inner {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .gate-inner h2 { margin-bottom: 8px; font-size: 20px; color: #fff; }
    .gate-inner p.muted { color: #888; font-size: 13px; margin-bottom: 16px; }
    .gate-inner input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      background: #121212;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .gate-inner input:focus { border-color: #777; }
    .gate-inner button {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .gate-inner button:hover { background: #3a3a3a; }
    .gate-inner .error { color: #ff5555; font-size: 13px; margin-bottom: 10px; min-height: 18px; }

    /* Disposition 2 Colonnes */
    .playtest-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
      max-width: 850px;
      margin-top: 20px;
    }

    @media (max-width: 700px) {
      .playtest-container {
        grid-template-columns: 1fr;
      }
    }

    /* Cartes */
    .card {
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .card h2 {
      font-size: 16px;
      letter-spacing: 1px;
      color: #aaa;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* Colonne Gauche - Masque */
    .mask-container {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1 / 1;
      border: 2px dashed #3a3a3a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .mask-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Colonne Droite - Instabilité */
    .gauge-display {
      font-size: 3.5rem;
      font-weight: 800;
      color: #ffffff;
      margin: 10px 0 24px 0;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
    }

    /* Grille des 8 boutons (2 colonnes) */
    .btn-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }
    .btn-gauge {
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid #3d3d3d;
      background: #262626;
      color: #e0e0e0;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-gauge:hover {
      background: #333333;
      transform: translateY(-1px);
    }
    .btn-gauge:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <!-- Porte d’accès playtest -->
  <div class="gate" id="gate" style="display:none">
    <div class="gate-inner">
      <h2>Accès playtest</h2>
      <p class="muted">Entrez le mot de passe commun (fourni par l’organisateur).</p>
      <input id="gateInput" type="password" placeholder="Mot de passe">
      <div class="error" id="gateError"></div>
      <button id="gateBtn">Entrer</button>
    </div>
  </div>

  <!-- Application Principale -->
  <main class="playtest-container">
    <!-- COLONNE GAUCHE : Sujet & Masque -->
    <section class="card col-left">
      <h2>SUJET #01</h2>
      <div class="mask-container">
        <img id="maskImage" src="img/masque-placeholder.png" alt="Masque du sujet" class="mask-img" onerror="this.style.display='none'">
      </div>
    </section>

    <!-- COLONNE DROITE : Instabilité Mentale -->
    <section class="card col-right">
      <h2>INSTABILITÉ MENTALE</h2>
      <div class="gauge-display">
        <span id="gaugeValue">50 %</span>
      </div>

      <div class="btn-grid-2col">
        <button class="btn-gauge" data-change="-5">-5 %</button>
        <button class="btn-gauge" data-change="5">+5 %</button>
        <button class="btn-gauge" data-change="-10">-10 %</button>
        <button class="btn-gauge" data-change="10">+10 %</button>
        <button class="btn-gauge" data-change="-15">-15 %</button>
        <button class="btn-gauge" data-change="15">+15 %</button>
        <button class="btn-gauge" data-change="-20">-20 %</button>
        <button class="btn-gauge" data-change="20">+20 %</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
